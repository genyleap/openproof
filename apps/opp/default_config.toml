# Default configuration baseline for the OpenProof Protocol.
#
# This file is embedded into the opp binary at build time with the C++26
# #embed directive, so `opp --print-default-config` always prints exactly the
# defaults the binary was built with. There is no second copy in documentation
# to drift out of date.
#
# It contains no secrets and never will: secret-valued settings are written as
# references, and the loader rejects inline literals.

[server]
# Loopback by default. Exposing the listener should be a deliberate act.
bind_address = "127.0.0.1"
port = 8443
# Enable only when every connection reaches this loopback listener through a
# trusted reverse proxy that overwrites X-Forwarded-For with one client IP.
trust_proxy_client_ip = false

[logging]
level = "info"
console = true

[operations]
# Disabled unless an authenticated local/private Prometheus scraper is configured.
metrics_enabled = false
# metrics_bearer_token = "file:/run/openproof/secrets/metrics-bearer.token"
# Hard ceiling for all in-process metric series; raw paths and identities are
# never labels.
metrics_maximum_series = 512

[security]
# A secret is referenced, never written here. Supported forms:
#   env:NAME     read the environment variable NAME
#   file:/path   read the contents of /path
# token_signing_key = "env:OPENPROOF_TOKEN_SIGNING_KEY"
# Version 1 is the compatibility epoch. Increment only through
# `opp rotate-master-key`; versions greater than 1 require every dedicated
# persistent key below.
master_key_version = 1
# Optional dedicated 32-byte key for encrypted-at-rest credential envelopes.
# When omitted, version 1 is derived from token_signing_key for compatibility.
# credential_encryption_key = "hexfile:/run/openproof/secrets/credential-encryption.key"
credential_encryption_key_version = 1
# These long-lived one-way keys default to domain-separated derivations from
# token_signing_key for compatibility. Hex-encoded key files should use hexfile:.
# Configure all four before master rotation.
# password_pepper = "hexfile:/run/openproof/secrets/password-pepper.key"
# recovery_code_pepper = "hexfile:/run/openproof/secrets/recovery-code-pepper.key"
# audit_chain_key = "hexfile:/run/openproof/secrets/audit-chain.key"
# oauth_client_secret_key = "hexfile:/run/openproof/secrets/oauth-client-secret.key"

[gateway]
# Disabled until an explicit upstream and a master signing key are configured.
enabled = false
route_prefix = "/"
# upstream_host = "api.internal.example"
# upstream_port = 443
upstream_tls = true
# upstream_ca_file = "/etc/openproof/internal-ca.pem"
# Per-client/global-key token buckets. Tune only with edge abuse controls and
# measured product traffic; values are bounded to 1,000,000.
rate_limit_capacity = 1000
rate_limit_refill_per_second = 100
rate_limit_maximum_keys = 100000

[database]
# Required when auth.enabled=true. This must remain a secret reference.
# connection_string = "env:OPENPROOF_DATABASE_URL"
pool_size = 8
migration_directory = "migrations"

[auth]
enabled = false
provider_id = "local"
# organization_id = "tenant-id"
protected_route_prefix = "/"
# Enabling auth also requires at least one explicit [[auth.route_policies]]
# table. Each table declares path_prefix, methods, required_roles, role_match
# ("any" or "all"), minimum_assurance ("ial1" through "ial4"), and an optional
# required_scope and required_audience for OAuth/OIDC access tokens.


[account]
# Consumer signup, verified email/phone, password reset and profile self-service.
enabled = false
phone_provider_id = "phone"
# Verification delivery is delegated to a private authenticated webhook that
# delivers email or SMS based on the payload channel.
# delivery_host = "notifications.internal.example"
# delivery_port = 443
delivery_tls = true
delivery_path = "/v1/openproof/verification"
# delivery_ca_file = "/etc/openproof/internal-ca.pem"
# delivery_authorization = "env:OPENPROOF_VERIFICATION_WEBHOOK_TOKEN"

[oidc]
# Enables the central OAuth/OIDC identity provider. Requires auth, PostgreSQL,
# the master security key, and an RSA private key supplied by secret reference.
enabled = false
# issuer = "https://identity.example.com"
key_id = "openproof-rs256-1"
# signing_key = "file:/run/secrets/openproof-oidc-private.pem"
# Optional directory of previous RSA public keys retained during rotation.
# Each regular `<kid>.pem` file is published in JWKS but never used for signing.
# previous_signing_keys_directory = "/run/openproof/previous-oidc-keys"
