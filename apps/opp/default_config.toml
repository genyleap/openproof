# Default configuration baseline for the OpenProof Protocol.
#
# This file is embedded into the opp binary at build time with the C++26
# #embed directive, so `opp --print-default-config` always prints exactly the
# defaults the binary was built with. There is no second copy in documentation
# to drift out of date.
#
# It contains no secrets and never will: secret-valued settings are written as
# references, and the loader rejects inline literals.

[server]
# Loopback by default. Exposing the listener should be a deliberate act.
bind_address = "127.0.0.1"
port = 8443

[logging]
level = "info"
console = true

[security]
# A secret is referenced, never written here. Supported forms:
#   env:NAME     read the environment variable NAME
#   file:/path   read the contents of /path
# token_signing_key = "env:OPENPROOF_TOKEN_SIGNING_KEY"

[gateway]
# Disabled until an explicit upstream and a master signing key are configured.
enabled = false
route_prefix = "/"
# upstream_host = "api.internal.example"
# upstream_port = 443
upstream_tls = true
# upstream_ca_file = "/etc/openproof/internal-ca.pem"

[database]
# Required when auth.enabled=true. This must remain a secret reference.
# connection_string = "env:OPENPROOF_DATABASE_URL"
pool_size = 8
migration_directory = "migrations"

[auth]
enabled = false
provider_id = "local"
# organization_id = "tenant-id"
protected_route_prefix = "/"
# Enabling auth also requires at least one explicit [[auth.route_policies]]
# table. Each table declares path_prefix, methods, required_roles, role_match
# ("any" or "all"), minimum_assurance ("ial1" through "ial4"), and an optional
# required_scope and required_audience for OAuth/OIDC access tokens.


[account]
# Consumer signup, verified email/phone, password reset and profile self-service.
enabled = false
phone_provider_id = "phone"
# Verification delivery is delegated to a private authenticated webhook that
# delivers email or SMS based on the payload channel.
# delivery_host = "notifications.internal.example"
# delivery_port = 443
delivery_tls = true
delivery_path = "/v1/openproof/verification"
# delivery_ca_file = "/etc/openproof/internal-ca.pem"
# delivery_authorization = "env:OPENPROOF_VERIFICATION_WEBHOOK_TOKEN"

[oidc]
# Enables the central OAuth/OIDC identity provider. Requires auth, PostgreSQL,
# the master security key, and an RSA private key supplied by secret reference.
enabled = false
# issuer = "https://identity.example.com"
key_id = "openproof-rs256-1"
# signing_key = "file:/run/secrets/openproof-oidc-private.pem"
