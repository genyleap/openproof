      requestBody:
        required: true
        content:
          application/scim+json:
            schema: {$ref: "#/components/schemas/ScimGroup"}
      responses:
        "200": {description: Replaced SCIM group with a new ETag.}
    patch:
      tags: [SCIM]
      operationId: patchScimGroup
      security: [{scimBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IfMatchRequired"}
      requestBody: {$ref: "#/components/requestBodies/ScimPatch"}
      responses:
        "200": {description: Patched SCIM group with a new ETag.}
    delete:
