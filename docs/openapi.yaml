    post:
      tags: [SCIM]
      operationId: createScimGroup
      security: [{scimBearer: []}]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: {$ref: "#/components/schemas/ScimGroup"}
      responses:
        "201": {description: SCIM group created with Location and ETag.}
  /scim/v2/Groups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [SCIM]
      operationId: getScimGroup
      security: [{scimBearer: []}]
      responses:
        "200": {description: SCIM group with ETag.}
    put:
      tags: [SCIM]
      operationId: replaceScimGroup
      security: [{scimBearer: []}]
