                csrf: {type: string}
      responses:
        "200": {description: Device authorization decision accepted.}
  /oauth/token:
    post:
      tags: [OAuth]
      operationId: token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, client_credentials, urn:ietf:params:oauth:grant-type:device_code, urn:ietf:params:oauth:grant-type:token-exchange]
                client_id: {type: string}
                client_secret: {type: string, format: password}
                code: {type: string}
                redirect_uri: {type: string, format: uri}
                code_verifier: {type: string}
                refresh_token: {type: string}
                device_code: {type: string}
                subject_token: {type: string}
                subject_token_type: {type: string}
                scope: {type: string}
                resource: {type: string, format: uri}
      responses:
        "200":
          description: Token response; rotated refresh token replaces the submitted token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenResponse"}
        "400": {$ref: "#/components/responses/OAuthError"}
        "401": {$ref: "#/components/responses/OAuthError"}
  /oauth/userinfo:
    get:
      tags: [OAuth]
      operationId: userInfo
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OIDC claims for the access-token subject.}
        "401": {$ref: "#/components/responses/OAuthError"}
    post:
      tags: [OAuth]
      operationId: userInfoPost
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OIDC claims for the access-token subject.}
        "401": {$ref: "#/components/responses/OAuthError"}
  /oauth/revoke:
    post:
      tags: [OAuth]
      operationId: revokeToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, token]
              properties:
                client_id: {type: string}
                client_secret: {type: string, format: password}
                token: {type: string}
                token_type_hint: {type: string}
      responses:
        "200": {description: Revocation is idempotent.}
  /oauth/introspect:
    post:
      tags: [OAuth]
