        "204": {description: SCIM group removed.}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-openproof-session
    preauthCookies:
      type: apiKey
      in: cookie
      name: __Host-openproof-preauth
    passkeyRegistrationCookie:
      type: apiKey
      in: cookie
      name: __Host-openproof-webauthn-registration
    bearerAuth:
      type: http
      scheme: bearer
    scimBearer:
      type: http
      scheme: bearer
      description: Dedicated operator-generated SCIM bearer; not a user OAuth token.
    metricsBearer:
      type: http
      scheme: bearer
      description: Dedicated private-scraper bearer; never a user OAuth token.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag returned by the prior read; recommended for concurrency safety.
      schema: {type: string}
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: ETag returned by the prior read.
      schema: {type: string}
  requestBodies:
    VerificationProof:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VerificationProof"}
    IdentitySelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [identity_id]
            properties:
              identity_id: {type: string, maxLength: 200}
    MemberRoles:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [identity_id, roles]
            properties:
              identity_id: {type: string, maxLength: 200}
              roles: {$ref: "#/components/schemas/Roles"}
    ClientSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [client_id]
            properties:
              client_id: {type: string, maxLength: 256}
    ScimPatch:
      required: true
      content:
        application/scim+json:
          schema: {$ref: "#/components/schemas/ScimPatch"}
  responses:
    Error:
      description: Stable client-safe OpenProof error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    OAuthError:
      description: OAuth protocol error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              error_description: {type: string}
    Unavailable:
      description: Dependency unavailable; details intentionally omitted.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Health"}
    ScimError:
      description: RFC 7644 error response.
      content:
        application/scim+json:
          schema:
            type: object
            required: [schemas, status, detail]
            properties:
              schemas:
                type: array
                items: {type: string, const: "urn:ietf:params:scim:api:messages:2.0:Error"}
              status: {type: string}
              scimType: {type: string}
              detail: {type: string}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, unavailable]}
    VerificationProof:
      type: object
      additionalProperties: false
      required: [verification_id, secret]
      properties:
        verification_id: {type: string, maxLength: 200}
        secret: {type: string, maxLength: 512}
    PasswordReset:
      type: object
      additionalProperties: false
      required: [verification_id, secret, new_password]
      properties:
        verification_id: {type: string, maxLength: 200}
        secret: {type: string, maxLength: 512}
        new_password: {type: string, format: password, maxLength: 1024}
    EmailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
    AccountSession:
      type: object
      additionalProperties: false
      required: [session_id, provider, assurance, phishing_resistant, issued_at_ms, last_seen_at_ms, absolute_expires_at_ms, idle_expires_at_ms, current]
      properties:
        session_id: {type: string, minLength: 1, maxLength: 200, description: Opaque action identifier. Do not display it as a user-facing device name.}
        provider: {type: string, minLength: 1, maxLength: 200}
        assurance: {type: string}
        phishing_resistant: {type: boolean}
        issued_at_ms: {type: integer, format: int64}
        last_seen_at_ms: {type: integer, format: int64}
        absolute_expires_at_ms: {type: integer, format: int64}
        idle_expires_at_ms: {type: integer, format: int64}
        current: {type: boolean}
        user_agent: {type: string, maxLength: 1024, description: Client metadata captured when the session was issued. May be absent for older sessions.}
    AccountConnection:
      type: object
      additionalProperties: false
      required: [provider, subject]
      properties:
        provider: {type: string, minLength: 1, maxLength: 128}
        subject: {type: string, minLength: 1, maxLength: 4096}
        fid:
          type: string
          pattern: "^[0-9]+$"
          description: Stable Farcaster ID when the connection provider is farcaster.
        profile_url:
          type: string
          format: uri
          description: Stable public profile URL for providers that expose one.
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: [string, "null"], maxLength: 256, description: Null or an empty string clears the field.}
        preferred_username: {type: [string, "null"], maxLength: 128, description: Null or an empty string clears the field.}
        locale: {type: [string, "null"], maxLength: 64, description: Null or an empty string clears the field.}
        picture: {type: [string, "null"], format: uri, maxLength: 2048, description: Null or an empty string clears the field.}
    WebAuthnOptions:
      type: object
      description: PublicKeyCredential options. Pass directly to the platform WebAuthn API after base64url decoding fields as required by that API.
      required: [publicKey]
      properties:
        publicKey: {type: object, additionalProperties: true}
    WebAuthnRegistration:
      type: object
      additionalProperties: false
      required: [credential_id, client_data_json, attestation_object]
      properties:
        credential_id: {type: string, maxLength: 4096, description: base64url rawId}
        client_data_json: {type: string, maxLength: 32768, description: base64url clientDataJSON}
        attestation_object: {type: string, maxLength: 131072, description: base64url attestationObject}
    WebAuthnAssertion:
      type: object
      additionalProperties: false
      required: [credential_id, client_data_json, authenticator_data, signature]
      properties:
        credential_id: {type: string, maxLength: 4096}
        client_data_json: {type: string, maxLength: 32768}
        authenticator_data: {type: string, maxLength: 131072}
        signature: {type: string, maxLength: 4096}
        user_handle: {type: string, maxLength: 4096}
    Web3Start:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {type: string, enum: [ethereum-wallet, farcaster]}
        address: {type: string, maxLength: 64, description: Required for EVM wallet login; optional for direct SIWF.}
        chain_id: {type: string, pattern: "^[1-9][0-9]{0,19}$", maxLength: 20, description: Current positive decimal EVM chain ID; required for ethereum-wallet and not accepted for Farcaster.}
        fid: {type: string, pattern: "^[1-9][0-9]{0,19}$", maxLength: 20, description: Paired with address for direct SIWF.}
        handoff_ticket: {type: string, maxLength: 256, description: Optional one-time mobile wallet publisher ticket; accepted only for ethereum-wallet.}
      oneOf:
        - properties:
            provider: {const: ethereum-wallet}
          required: [address, chain_id]
        - properties:
            provider: {const: farcaster}
          not:
            anyOf:
              - required: [chain_id]
              - required: [handoff_ticket]
          dependentRequired:
            address: [fid]
            fid: [address]
    Web3Completion:
      type: object
      additionalProperties: false
      required: [message, signature]
      properties:
        message: {type: string, maxLength: 8192}
        signature: {type: string, maxLength: 8192}
    Web3Challenge:
      type: object
      additionalProperties: false
      required: [provider, challenge_id, expires_at, chain_id]
      properties:
        provider: {type: string, enum: [ethereum-wallet, farcaster]}
        challenge_id: {type: string}
        expires_at: {type: string, format: date-time}
        message: {type: string, maxLength: 8192}
        address: {type: string, maxLength: 64}
        fid: {type: string, maxLength: 20}
        chain_id: {type: string}
        nonce: {type: string, minLength: 8, maxLength: 64}
        domain: {type: string}
        uri: {type: string, format: uri}
        statement: {type: string, const: Farcaster Auth}
        resource_prefix: {type: string, const: "farcaster://fid/"}
        signer_kind: {type: string, enum: [custody, auth_address]}
    LdapCompletion:
      type: object
      additionalProperties: false
      required: [transaction_id, challenge_id, username, username_binding, password]
      properties:
        transaction_id: {type: string, maxLength: 256}
        challenge_id: {type: string, maxLength: 256}
        username: {type: string, maxLength: 320}
        username_binding: {type: string, maxLength: 256}
        password: {type: string, format: password, maxLength: 4096}
    PushedAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: {type: string}
        client_secret: {type: string, format: password}
        response_type: {type: string, const: code}
        redirect_uri: {type: string, format: uri}
        scope: {type: string}
        code_challenge: {type: string}
        code_challenge_method: {type: string, const: S256}
        state: {type: string}
        nonce: {type: string}
        max_age: {type: string}
        resource: {type: string, format: uri}
        response_mode: {type: string, enum: [query, jwt]}
        request: {type: string, description: Signed JAR request object; cannot be mixed with authorization parameters.}
    EvidenceVerification:
      type: object
      required: [provider, challenge]
      properties:
        provider: {type: string, enum: [signed-jwt-evidence, x509-evidence]}
        challenge: {type: string, maxLength: 256}
        assertion: {type: string, maxLength: 16384, description: Required for signed-jwt-evidence.}
        certificate_pem: {type: string, maxLength: 65536, description: Required for x509-evidence.}
        signature: {type: string, maxLength: 12288, description: Required for x509-evidence.}
    Roles:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items: {type: string, maxLength: 128}
    LocalMemberCreate:
      type: object
      additionalProperties: false
      required: [identity_id, subject, roles]
      properties:
        identity_id: {type: string, maxLength: 200}
        subject: {type: string, maxLength: 320}
        roles: {$ref: "#/components/schemas/Roles"}
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [identifier, name, environment]
      properties:
        identifier: {type: string, maxLength: 64}
        name: {type: string, maxLength: 120}
        environment: {type: string, enum: [production, staging, development]}
    ClientCreate:
      type: object
      additionalProperties: false
      required: [application_id, name, kind, redirect_uris, scopes]
      properties:
        application_id: {type: string, maxLength: 256}
        name: {type: string, maxLength: 120}
        kind: {type: string, enum: [web, native, browser, service]}
        redirect_uris:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, maxLength: 2048}
        scopes:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, maxLength: 128}
    JarKeyRegistration:
      type: object
      additionalProperties: false
      required: [client_id, key_id, public_key_pem]
      properties:
        client_id: {type: string, maxLength: 256}
        key_id: {type: string, maxLength: 128}
        public_key_pem: {type: string, maxLength: 16384}
    ResourceCreate:
      type: object
      additionalProperties: false
      required: [audience, name, scopes]
      properties:
        audience: {type: string, maxLength: 2048}
        name: {type: string, maxLength: 120}
        scopes:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: {type: string, maxLength: 128}
    ServiceIdentityCreate:
      type: object
      additionalProperties: false
      required: [client_id, audiences, scopes]
      properties:
        client_id: {type: string, maxLength: 256}
        audiences:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, maxLength: 2048}
        scopes:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: {type: string, maxLength: 128}
    Profile:
      type: object
      properties:
        identity_id: {type: string}
        display_name: {type: [string, "null"]}
        preferred_username: {type: [string, "null"]}
        email: {type: [string, "null"], format: email}
        email_verified: {type: boolean}
        phone_number: {type: [string, "null"]}
        phone_number_verified: {type: boolean}
        locale: {type: [string, "null"]}
        picture: {type: [string, "null"], format: uri}
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string}
        expires_in: {type: integer}
        refresh_token: {type: string}
        id_token: {type: string}
        scope: {type: string}
    ScimUser:
      type: object
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items: {type: string}
        id: {type: string, readOnly: true}
        externalId: {type: string, maxLength: 1024}
        userName: {type: string, maxLength: 320}
        displayName: {type: string, maxLength: 512}
        active: {type: boolean, default: true}
        emails:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: {type: string, format: email}
              primary: {type: boolean}
              type: {type: string}
        meta: {type: object, readOnly: true, additionalProperties: true}
    ScimGroup:
      type: object
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          items: {type: string}
        id: {type: string, readOnly: true}
        externalId: {type: string, maxLength: 1024}
        displayName: {type: string, maxLength: 512}
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: {type: string}
              display: {type: string, readOnly: true}
              $ref: {type: string, readOnly: true}
        meta: {type: object, readOnly: true, additionalProperties: true}
    ScimPatch:
      type: object
      additionalProperties: false
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          minItems: 1
          items: {type: string, const: "urn:ietf:params:scim:api:messages:2.0:PatchOp"}
        Operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [op]
            properties:
              op: {type: string, enum: [add, Add, replace, Replace, remove, Remove]}
              path: {type: string}
              value: {}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
