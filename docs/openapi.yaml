        "401": {$ref: "#/components/responses/OAuthError"}
  /oauth/device_authorization:
    post:
      tags: [OAuth]
      operationId: deviceAuthorization
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, scope]
