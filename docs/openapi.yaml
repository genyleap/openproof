      responses:
        "204": {description: Consent revoked.}
  /oauth/par:
    post:
      tags: [OAuth]
      operationId: pushedAuthorizationRequest
      description: RFC 9126 PAR. Confidential clients send client_secret in the form; public clients omit it.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/PushedAuthorizationRequest"}
      responses:
        "201": {description: Pushed request URI and expiry.}
