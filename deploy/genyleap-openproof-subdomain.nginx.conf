# Genyleap production OpenProof hostname.
# Prerequisite: DNS for openproof.genyleap.com must resolve to the Genyleap edge,
# and a TLS certificate must exist at the paths below before enabling this file.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openproof.genyleap.com;

    ssl_certificate /etc/letsencrypt/live/openproof.genyleap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openproof.genyleap.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    # Human-facing service panel.
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/genyleap.com/site_v2/public/openproof.php;
        fastcgi_param SCRIPT_NAME /;
        fastcgi_param DOCUMENT_ROOT /var/www/genyleap.com/site_v2/public;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Keep metrics private even on the dedicated identity hostname.
    location = /metrics {
        return 404;
    }

    # Direct OpenProof API namespace on the dedicated hostname:
    # /auth/*, /account/*, /.well-known/*, /oauth/*, ...
    location / {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        proxy_request_buffering on;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Client-Cert-Sha256 "";
        proxy_set_header X-Forwarded-Client-Cert-Timestamp "";
        proxy_set_header X-Forwarded-Client-Cert-Nonce "";
        proxy_set_header X-Forwarded-Client-Cert-Signature "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name openproof.genyleap.com;
    return 308 https://$host$request_uri;
}
