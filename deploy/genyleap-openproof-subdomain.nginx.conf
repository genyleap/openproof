# Genyleap production OpenProof hostname.
# Public TLS is terminated by Cloudflare. The origin uses a Cloudflare Origin CA
# certificate and Full (strict) mode. Keep the key outside source control.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openproof.genyleap.com;

    ssl_certificate /etc/openproof/tls/genyleap-origin.pem;
    ssl_certificate_key /etc/openproof/tls/genyleap-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    # Canonical human-facing product page.
    location = / {
        return 302 https://genyleap.com/products/openproof;
    }

    location = /metrics {
        return 404;
    }

    # Compatibility with the main-site /openproof/* namespace.
    location = /openproof/metrics {
        return 404;
    }

    location ^~ /openproof/ {
        proxy_pass http://127.0.0.1:18443/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        proxy_request_buffering on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Prefix /openproof;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Client-Cert-Sha256 "";
        proxy_set_header X-Forwarded-Client-Cert-Timestamp "";
        proxy_set_header X-Forwarded-Client-Cert-Nonce "";
        proxy_set_header X-Forwarded-Client-Cert-Signature "";
    }

    # Native OpenProof API namespace:
    # /health/*, /auth/*, /account/*, /.well-known/*, /oauth/*, ...
    location / {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        proxy_request_buffering on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Client-Cert-Sha256 "";
        proxy_set_header X-Forwarded-Client-Cert-Timestamp "";
        proxy_set_header X-Forwarded-Client-Cert-Nonce "";
        proxy_set_header X-Forwarded-Client-Cert-Signature "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name openproof.genyleap.com;
    return 308 https://$host$request_uri;
}
