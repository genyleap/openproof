# Replace identity.example.com and certificate paths before enabling this file.
# This server is the exclusive ingress to opp's loopback-only listener.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name identity.example.com;

    ssl_certificate /etc/letsencrypt/live/identity.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/identity.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:openproof_tls:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 8m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 30s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Metrics are available only on the loopback listener to an authenticated
    # local/private scraper; never publish them on the identity edge.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_intercept_errors off;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite instead of appending. OpenProof accepts exactly one IP and
        # consumes this header when trust_proxy_client_ip=true.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Never allow public callers to forge the authenticated mTLS-forwarding
        # envelope. A dedicated mTLS sidecar must compute these fields itself.
        proxy_set_header X-Forwarded-Client-Cert-Sha256 "";
        proxy_set_header X-Forwarded-Client-Cert-Timestamp "";
        proxy_set_header X-Forwarded-Client-Cert-Nonce "";
        proxy_set_header X-Forwarded-Client-Cert-Signature "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name identity.example.com;
    return 308 https://$host$request_uri;
}
