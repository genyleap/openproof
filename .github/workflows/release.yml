name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Match tag to VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v$version"
          if [[ "${{ github.ref_name }}" != "$expected" ]]; then
            echo "Tag ${{ github.ref_name }} does not match VERSION ($expected)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Boost 1.88
        uses: actions/cache@v4
        with:
          path: ~/.cache/openproof/boost-1.88.0
          key: boost-1.88.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install build dependencies
        run: ./scripts/ci/install-build-deps.sh

      - name: Configure
        run: |
          cmake --preset gcc-release \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/openproof/boost-1.88.0/install"

      - name: Build
        run: cmake --build --preset gcc-release --parallel 2

      - name: Test
        run: ctest --preset gcc-release --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          ./packaging/build-deb.sh cmake-build-gcc-release dist "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: openproof-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum openproof_*.deb | sort -k2 > SHA256SUMS

      - name: Inspect release assets
        run: |
          cat dist/SHA256SUMS
          test -f "dist/openproof_${{ needs.validate.outputs.version }}_amd64.deb"
          test -f "dist/openproof_${{ needs.validate.outputs.version }}_arm64.deb"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openproof_*.deb
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
