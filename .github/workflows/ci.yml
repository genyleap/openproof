name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve a running full build/benchmark on the consolidated migration PR.
  # A newer head still needs its own successful run; don't discard the only
  # completed diagnostic data set whenever another migration patch lands.
  # Mainline and ordinary PRs still cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/perf/openproof-full-optimization-20261026' && github.head_ref != 'integration/native-runtime-schema-20261126' && github.ref != 'refs/heads/integration/native-runtime-schema-20261126' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lint tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3
      - name: Shellcheck
        run: |
          shellcheck --severity=error installer/bootstrap.sh installer/setup.sh installer/openproof \
            packaging/build-deb.sh packaging/build-bundle.sh scripts/ci/install-build-deps.sh \
            scripts/ci/run-paired-e2e-baseline.sh \
            scripts/ci/run-repeated-mixed-read.sh \
            scripts/backup-postgres.sh scripts/restore-postgres.sh
      - name: Protocol independence gate
        run: python3 scripts/check-protocol-neutrality.py
      - name: Pinned release schema checksum inventory
        run: python3 scripts/inventory-release-schema.py --check
      - name: CSPRNG temporary entropy and zeroization regression
        run: node scripts/test-security-random-wipe.mjs
      - name: OpenAPI coverage
        run: python3 scripts/verify-openapi.py
      - name: Portal behavior
        run: node scripts/test-local-demo-portal-ui.mjs
      - name: JavaScript SDK
        run: node sdk/javascript/test.mjs
      - name: Docs MCP dependency security and transport regression
        working-directory: tools/docs-mcp
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run check
          npm test
      - name: Development bundle provenance and isolation regressions
        run: python3 -B scripts/ci/test-development-bundle.py
      - name: Sanitized disposable E2E startup diagnostics
        run: node --test scripts/test-e2e-startup-diagnostics.mjs
      - name: Native account profile tenant and capability contract
        run: |
          node scripts/test-coroutine-native-capability-defaults.mjs
          node scripts/test-coroutine-account-profile-contract.mjs
          node scripts/test-coroutine-account-connections-contract.mjs
          node scripts/test-coroutine-account-totp-status-contract.mjs
          node scripts/test-native-admin-members-contract.mjs
          node scripts/test-coroutine-admin-authorization.mjs
          node scripts/test-native-recovery-runtime-contract.mjs
      - name: Native gateway transport retirement contract
        run: |
          node scripts/test-gateway-translation-unit-split.mjs
          node scripts/test-native-gateway-tls-completion.mjs
      - name: Mandatory native account credential lifecycle contract
        run: |
          node scripts/test-coroutine-native-contact-runtime.mjs
          node scripts/test-coroutine-native-signup-foundation.mjs
          node scripts/test-coroutine-account-session-http-contract.mjs
          node scripts/test-coroutine-native-auth-secret-scrub.mjs
          node scripts/test-native-http-credential-erasure.mjs
          node scripts/test-coroutine-provider-transports.mjs
      - name: Native OAuth token read contract
        run: |
          node scripts/test-coroutine-native-oauth-token-read.mjs
          node scripts/test-coroutine-native-health-runtime.mjs
          node scripts/test-coroutine-native-application-read.mjs
          node scripts/test-coroutine-native-passkey-account.mjs
          node scripts/test-coroutine-native-scim-read.mjs
          node scripts/test-coroutine-native-evidence-runtime.mjs
      - name: Mandatory native public discovery and provider catalog contract
        run: |
          node scripts/test-coroutine-native-oidc-discovery-runtime.mjs
          node scripts/test-coroutine-native-provider-catalog-runtime.mjs
      - name: Native LDAP disposable fixture and transport contract
        run: |
          node scripts/test-native-enterprise-ldaps.mjs
          node scripts/test-coroutine-enterprise-ldap.mjs
          node scripts/test-native-ldap-real-e2e-contract.mjs
      - name: Whitespace
        run: git diff --check
      - name: End-to-end coroutine coverage gate
        run: node scripts/verify-coroutine-coverage.mjs

  schema-baseline:
    name: Disposable schema baseline round-trip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
      - name: Verify release artifact inventory matching
        run: python3 scripts/test-verify-migration-artifacts.py
      - name: Verify baseline migration admission
        run: python3 scripts/test-verify-schema-baseline.py
      - name: Verify disposable baseline reconstruction
        run: python3 scripts/verify-schema-baseline.py

  ldap-fixture:
    name: Real LDAPS fixture preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ldap-utils openssl
      - name: Build isolated LDAP fixture image
        run: docker build --tag openproof-ldap-fixture:ci --file scripts/ci/native-ldap-fixture.Dockerfile scripts/ci
      - name: Verify real LDAPS fixture without building opp
        env:
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_E2E_NATIVE_LDAP_FIXTURE: "1"
        run: node scripts/ci/test-native-ldap-fixture.mjs

  build:
    name: Build and test
    needs: ldap-fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Boost 1.88
        uses: actions/cache@v4
        with:
          path: ~/.cache/openproof/boost-1.88.0
          key: boost-1.88.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install build dependencies
        run: ./scripts/ci/install-build-deps.sh

      - name: Install disposable LDAPS fixture client tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ldap-utils
      - name: Build isolated LDAP fixture image
        run: docker build --tag openproof-ldap-fixture:ci --file scripts/ci/native-ldap-fixture.Dockerfile scripts/ci

      - name: Configure
        run: |
          cmake --preset gcc-release \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/openproof/boost-1.88.0/install"

      # Diagnostic only: compare compiler inlining on a bounded synthetic
      # workload. A failed probe never weakens warnings, sanitizers or the
      # required native executable and integration gates below.
      - name: Asio coroutine inlining diagnostic
        if: github.ref == 'refs/heads/dev'
        timeout-minutes: 10
        continue-on-error: true
        run: python3 scripts/ci/probe-asio-inline.py

      - name: Preserve Asio inlining diagnostic
        if: always() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: openproof-asio-inline-probe
          path: asio-inline-probe.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Repeated Gateway benchmark analysis regression
        run: node tests/scripts/gateway-bench-summary-test.mjs

      - name: Repeated mixed-read benchmark analysis regression
        run: node tests/scripts/mixed-read-summary-test.mjs

      - name: Read-only deployment readiness probe regression
        run: node tests/scripts/live-readiness-test.mjs

      - name: Native PostgreSQL coroutine integration
        env:
          OPENPROOF_TEST_POSTGRES_DOMAIN: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_coroutine_ci
          OPENPROOF_TEST_POSTGRES_DOMAIN_ACK: YES_EXCLUSIVE_DISPOSABLE_DATABASE
        run: |
          # This is a disposable CI runner; never run migrations or seed
          # records against a shared staging or production database.
          sudo -u postgres createdb -O openproof_ci openproof_coroutine_ci
          cmake --build --preset gcc-release --target openproof_postgres_async_tests openproof_postgres_domain_tests openproof_postgres_native_only_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_postgres_native_only_tests
          ./cmake-build-gcc-release/tests/openproof_postgres_async_tests --gtest_filter='PostgresNativeCoroutineTest.*:PostgresAsyncPoolTest.*:PostgresAsyncSessionSqlTest.*'
          ./cmake-build-gcc-release/tests/openproof_postgres_domain_tests --gtest_filter='PostgresCoroutineDomainTest.*:PostgresCoroutineRealDatabaseTest.*'

      - name: Native Gateway coroutine and real TCP regression
        timeout-minutes: 15
        run: |
          cmake --build --preset gcc-release --target openproof_gateway_http_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_gateway_http_tests \
            --gtest_filter='BeastHttpIntegrationTest.*'

      # Validate the opt-in native account boundary in-process before
      # invoking the disposable HTTP E2E. This isolates C++ coroutine
      # regressions from proxy/backend diagnostic noise.
      - name: Focused native account coroutine C++ regressions
        run: |
          cmake --build --preset gcc-release --target openproof_account_coroutine_http_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_account_coroutine_http_tests
          cmake --build --preset gcc-release --target openproof_admin_coroutine_http_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_admin_coroutine_http_tests
          cmake --build --preset gcc-release --target openproof_admin_lifecycle_http_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_admin_lifecycle_http_tests
          cmake --build --preset gcc-release --target openproof_native_health_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_native_health_tests

      # A dedicated Unix-socket PostgreSQL instance, created and destroyed
      # by the checked-in guard script, validates the new connection SQL
      # against real tenant/lifecycle fixture rows before HTTP E2E.
      - name: Native canonical connections isolated PostgreSQL regressions
        timeout-minutes: 20
        run: |
          cmake --build --preset gcc-release --target openproof_postgres_async_canonical_tests --parallel 2
          bash scripts/run-disposable-postgres-canonical-tests.sh

      - name: Build opp executable
        # Keep compiling independent translation units after the first error
        # so the next migration fix can address every reported blocker.
        # Ninja still exits nonzero if any compilation or link fails.
        run: cmake --build --preset gcc-release --target opp --parallel 2 -- -k 0

      - name: Verify executable has no blocking PostgreSQL symbols
        run: |
          nm -C ./cmake-build-gcc-release/apps/opp/opp > "${RUNNER_TEMP}/opp-symbols.txt"
          if grep -E '(^|[[:space:]])(PQexec(Params)?|PQconnectdb(Params)?|PQreset)(@[^[:space:]]+)?$|openproof::storage::postgres::(ConnectionPool|PostgresAdministrationRepository|PostgresCredentialRekeyer|PostgresMasterKeyRotator)::' "${RUNNER_TEMP}/opp-symbols.txt"; then
            echo "Blocking PostgreSQL implementation linked into opp"
            exit 1
          fi

      # Run the ordinary identity-platform HTTP scenarios over real native
      # PostgreSQL profile reads, with a separate disposable database. Keep
      # the paired baseline workload unchanged by not enabling these flags
      # in the default E2E and performance comparison.
      - name: Native account profile read disposable PostgreSQL E2E
        timeout-minutes: 20
        env:
          OPENPROOF_E2E_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_native_profile_e2e_ci
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_SESSIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_PROFILE: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_CONNECTIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_TOTP_STATUS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_SIGNUP: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_AUTH_SESSIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ADMIN_MEMBERS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_RECOVERY_CODES: "1"
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_native_profile_e2e_ci
          node scripts/e2e-identity-platform.mjs

      # Repeat the native HTTP workload on a DIFFERENT empty, disposable
      # database. A single green run does not establish stability after the
      # previously observed 502 on the connections read.
      - name: Repeated native connections disposable PostgreSQL HTTP E2E
        timeout-minutes: 20
        env:
          OPENPROOF_E2E_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_native_connections_e2e_ci
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_SESSIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_PROFILE: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_CONNECTIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_TOTP_STATUS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_SIGNUP: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_AUTH_SESSIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ADMIN_MEMBERS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_RECOVERY_CODES: "1"
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_native_connections_e2e_ci
          node scripts/e2e-identity-platform.mjs

      - name: Native LDAP TLS and PostgreSQL HTTP E2E
        timeout-minutes: 20
        env:
          OPENPROOF_E2E_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_native_ldap_e2e_ci
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_E2E_NATIVE_LDAP_FIXTURE: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_LOCAL_LOGIN: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_ACCOUNT_SESSIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_AUTH_SESSIONS: "1"
          OPENPROOF_EXPERIMENTAL_NATIVE_RECOVERY_CODES: "1"
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_native_ldap_e2e_ci
          node scripts/e2e-identity-platform.mjs

      # Run the real application E2E immediately after the executable
      # links, even if another independent test binary cannot link. A
      # benchmark result is still NOT release approval without all gates.
      - name: Isolated OpenProof PostgreSQL E2E and mixed-read benchmark
        timeout-minutes: 20
        env:
          OPENPROOF_E2E_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_e2e
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_E2E_LOAD_REQUESTS: "600"
          OPENPROOF_E2E_LOAD_CONCURRENCY: "24"
          OPENPROOF_E2E_METRICS_FILE: ${{ github.workspace }}/openproof-e2e-metrics.json
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_e2e
          node scripts/e2e-identity-platform.mjs

      - name: Preserve non-sensitive E2E benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openproof-e2e-metrics
          path: openproof-e2e-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: cmake --build --preset gcc-release --parallel 2 -- -k 0

      - name: Destructive PostgreSQL integration in private socket fixture
        timeout-minutes: 15
        run: bash scripts/run-disposable-postgres-integration-tests.sh

      - name: Test
        run: ctest --preset gcc-release --output-on-failure -E '^PostgresIntegrationTest\.'

      - name: Consolidated fresh schema and legacy-ledger integration
        env:
          OPENPROOF_TEST_BASELINE_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_baseline_ci
          OPENPROOF_TEST_BASELINE_DIRECTORY: ${{ runner.temp }}/openproof-baseline-fixture
          OPENPROOF_TEST_BASELINE_ACK: YES_EXCLUSIVE_DISPOSABLE_DATABASE
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_baseline_ci
          cp -a migrations "$OPENPROOF_TEST_BASELINE_DIRECTORY"
          python3 scripts/verify-schema-baseline.py --output-dir "$OPENPROOF_TEST_BASELINE_DIRECTORY/baseline" \
            --runtime-upgrade-tests ./cmake-build-gcc-release/tests/openproof_tests
          ./cmake-build-gcc-release/tests/openproof_tests --gtest_filter='PostgresMigrationBaselineTest.FreshSnapshotRecordsHistoricalChecksumsAndIsIdempotent'
          bash scripts/run-disposable-postgres-integration-tests.sh


      # Paired comparison is deliberately gated on the *full* test suite.
      # The candidate and pinned mainline baseline run on the same runner,
      # with distinct disposable databases and the same E2E workload.
      - name: Paired baseline E2E benchmark
        timeout-minutes: 35
        run: bash scripts/ci/run-paired-e2e-baseline.sh

      - name: Preserve pinned baseline benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openproof-e2e-baseline-metrics
          path: openproof-e2e-metrics-baseline.json
          if-no-files-found: ignore
          retention-days: 14

      # Real opp server binaries with a controlled 50ms local HTTP upstream.
      # Unlike the identity E2E sample, this exposes whether upstream network
      # waiting has stopped monopolizing the bounded handler workers.
      - name: Matched Gateway TCP delayed-upstream benchmark
        timeout-minutes: 10
        env:
          OPENPROOF_GATEWAY_BENCH_REQUESTS: "600"
          OPENPROOF_GATEWAY_BENCH_CONCURRENCY: "24"
          OPENPROOF_GATEWAY_BENCH_DELAY_MS: "50"
          OPENPROOF_GATEWAY_BENCH_METRICS: "1"
        run: |
          mkdir -p gateway-bench
          # Alternate execution order on the SAME runner to limit bias from
          # warm-up, CPU frequency and shared-runner scheduling.
          for trial in 1 2 3 4 5; do
            if (( trial % 2 == 0 )); then
              OPENPROOF_GATEWAY_BENCH_COMMIT=ccb396182936d717960fdca319999baf2f580ff9 \
                node scripts/benchmark-gateway-upstream.mjs \
                "${RUNNER_TEMP}/openproof-perf-baseline/cmake-build-gcc-release/apps/opp/opp" \
                "gateway-bench/baseline-${trial}.json"
              node scripts/benchmark-gateway-upstream.mjs \
                ./cmake-build-gcc-release/apps/opp/opp \
                "gateway-bench/candidate-${trial}.json"
            else
              node scripts/benchmark-gateway-upstream.mjs \
                ./cmake-build-gcc-release/apps/opp/opp \
                "gateway-bench/candidate-${trial}.json"
              OPENPROOF_GATEWAY_BENCH_COMMIT=ccb396182936d717960fdca319999baf2f580ff9 \
                node scripts/benchmark-gateway-upstream.mjs \
                "${RUNNER_TEMP}/openproof-perf-baseline/cmake-build-gcc-release/apps/opp/opp" \
                "gateway-bench/baseline-${trial}.json"
            fi
          done
          node scripts/summarize-gateway-bench.mjs gateway-bench

      - name: Preserve actual Gateway TCP measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openproof-gateway-tcp-benchmark
          path: gateway-bench/
          if-no-files-found: ignore
          retention-days: 14

      # Repeated matched HTTP measurements remain exploratory, not release
      # approval. Preserve original point and Gateway measurements.
      - name: Repeated paired mixed-read E2E benchmark
        if: github.ref == 'refs/heads/dev'
        timeout-minutes: 30
        run: bash scripts/ci/run-repeated-mixed-read.sh

      - name: Preserve repeated mixed-read measurements
        if: always() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: openproof-mixed-read-paired-benchmark
          path: mixed-read-bench/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build release packages
        run: |
          mkdir -p dist
          ./packaging/build-deb.sh cmake-build-gcc-release dist amd64
          ./packaging/build-bundle.sh cmake-build-gcc-release dist amd64
          dpkg-deb --info dist/openproof_*_amd64.deb
          tar -tzf dist/openproof_*_linux_amd64.tar.gz | grep -q './opt/openproof/bin/opp.real'

      - name: Build and verify opt-in schema baseline packages
        env:
          OPENPROOF_SCHEMA_BASELINE_DIRECTORY: ${{ runner.temp }}/openproof-baseline-fixture/baseline
        run: |
          mkdir -p dist-baseline
          ./packaging/build-deb.sh cmake-build-gcc-release dist-baseline amd64
          ./packaging/build-bundle.sh cmake-build-gcc-release dist-baseline amd64
          python3 scripts/verify-migration-artifacts.py --source migrations \
            --baseline-directory "$OPENPROOF_SCHEMA_BASELINE_DIRECTORY" \
            --deb dist-baseline/openproof_*_amd64.deb \
            --bundle dist-baseline/openproof_*_linux_amd64.tar.gz

      # A downloadable development candidate, not a published release.
      # Preserve the tested runtime library closure rather than a bare ELF.
      - name: Record verified development bundle provenance
        run: |
          python3 scripts/ci/development-bundle.py record dist/openproof_*_linux_amd64.tar.gz
      - name: Preserve verified development bundle
        uses: actions/upload-artifact@v4
        with:
          name: openproof-tested-development-bundle
          path: |
            dist/openproof_*_linux_amd64.tar.gz
            dist/development-bundle.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  dev-hardening:
    name: Development hardening (${{ matrix.preset }})
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-asan]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Cache qualified GCC and Boost
        uses: actions/cache@v4
        with:
          path: ~/.cache/openproof/boost-1.88.0
          key: boost-1.88.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install verified toolchain and disposable PostgreSQL
        run: ./scripts/ci/install-build-deps.sh
      - name: Configure hardening profile
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/openproof/boost-1.88.0/install"
      - name: Build all targets
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2 -- -k 0
      - name: Verify actual sanitizer instrumentation
        if: matrix.preset == 'gcc-asan'
        run: |
          ldd ./cmake-build-gcc-asan/apps/opp/opp
          ldd ./cmake-build-gcc-asan/apps/opp/opp | grep -q libasan
          ldd ./cmake-build-gcc-asan/apps/opp/opp | grep -q libubsan
      - name: Execute CTest suite
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -E '^PostgresIntegrationTest\.'
      - name: Native SQL domain against an exclusive disposable database
        env:
          OPENPROOF_TEST_POSTGRES_DOMAIN: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_coroutine_ci
          OPENPROOF_TEST_POSTGRES_DOMAIN_ACK: YES_EXCLUSIVE_DISPOSABLE_DATABASE
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_coroutine_ci
          ./cmake-build-${{ matrix.preset }}/tests/openproof_postgres_domain_tests \
            --gtest_filter='PostgresCoroutineDomainTest.*:PostgresCoroutineRealDatabaseTest.*'
      - name: Native canonical SQL and destructive integration
        run: |
          bash scripts/run-disposable-postgres-canonical-tests.sh "./cmake-build-${{ matrix.preset }}"
          bash scripts/run-disposable-postgres-integration-tests.sh "./cmake-build-${{ matrix.preset }}"
      - name: Fresh schema and historical ledger upgrade
        env:
          OPENPROOF_TEST_BASELINE_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_hardening_baseline
          OPENPROOF_TEST_BASELINE_DIRECTORY: ${{ runner.temp }}/openproof-hardening-baseline
          OPENPROOF_TEST_BASELINE_ACK: YES_EXCLUSIVE_DISPOSABLE_DATABASE
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_hardening_baseline
          cp -a migrations "$OPENPROOF_TEST_BASELINE_DIRECTORY"
          python3 scripts/verify-schema-baseline.py --output-dir "$OPENPROOF_TEST_BASELINE_DIRECTORY/baseline" \
            --runtime-upgrade-tests ./cmake-build-${{ matrix.preset }}/tests/openproof_tests
          ./cmake-build-${{ matrix.preset }}/tests/openproof_tests --gtest_filter='PostgresMigrationBaselineTest.FreshSnapshotRecordsHistoricalChecksumsAndIsIdempotent'
          bash scripts/run-disposable-postgres-integration-tests.sh "./cmake-build-${{ matrix.preset }}"
      - name: Install and build isolated LDAP fixture
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ldap-utils
          docker build --tag openproof-ldap-fixture:ci --file scripts/ci/native-ldap-fixture.Dockerfile scripts/ci
      - name: Execute real HTTP E2E under hardening profile
        timeout-minutes: 30
        env:
          OPENPROOF_E2E_OPP: ${{ github.workspace }}/cmake-build-${{ matrix.preset }}/apps/opp/opp
          OPENPROOF_E2E_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_hardening_e2e
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_E2E_NATIVE_LDAP_FIXTURE: "1"
          OPENPROOF_E2E_LOAD_REQUESTS: "24"
          OPENPROOF_E2E_LOAD_CONCURRENCY: "4"
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_hardening_e2e
          node scripts/e2e-identity-platform.mjs
