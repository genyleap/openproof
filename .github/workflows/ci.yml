name: CI

on:
  push:
    branches: [main, perf/openproof-full-optimization-20261026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve an in-flight full benchmark/E2E on the experimental branch;
  # otherwise each small follow-up commit cancels its only complete data set.
  # Mainline and ordinary PRs still cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/perf/openproof-full-optimization-20261026' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3
      - name: Shellcheck
        run: |
          shellcheck --severity=error installer/bootstrap.sh installer/setup.sh installer/openproof \
            packaging/build-deb.sh packaging/build-bundle.sh scripts/ci/install-build-deps.sh \
            scripts/ci/run-paired-e2e-baseline.sh \
            scripts/backup-postgres.sh scripts/restore-postgres.sh
      - name: Protocol independence gate
        run: python3 scripts/check-protocol-neutrality.py
      - name: OpenAPI coverage
        run: python3 scripts/verify-openapi.py
      - name: Portal behavior
        run: node scripts/test-local-demo-portal-ui.mjs
      - name: JavaScript SDK
        run: node sdk/javascript/test.mjs
      - name: Docs MCP dependency security and transport regression
        working-directory: tools/docs-mcp
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run check
          npm test
      - name: Whitespace
        run: git diff --check
      - name: End-to-end coroutine coverage gate
        run: node scripts/verify-coroutine-coverage.mjs

  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Boost 1.88
        uses: actions/cache@v4
        with:
          path: ~/.cache/openproof/boost-1.88.0
          key: boost-1.88.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install build dependencies
        run: ./scripts/ci/install-build-deps.sh

      - name: Configure
        run: |
          cmake --preset gcc-release \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/openproof/boost-1.88.0/install"

      - name: Repeated Gateway benchmark analysis regression
        run: node tests/scripts/gateway-bench-summary-test.mjs

      - name: Read-only deployment readiness probe regression
        run: node tests/scripts/live-readiness-test.mjs

      - name: Native PostgreSQL coroutine integration
        run: |
          cmake --build --preset gcc-release --target openproof_postgres_async_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_postgres_async_tests --gtest_filter='PostgresNativeCoroutineTest.*:PostgresAsyncPoolTest.*:PostgresAsyncSessionSqlTest.*'

      - name: Native Gateway coroutine and real TCP regression
        timeout-minutes: 15
        run: |
          cmake --build --preset gcc-release --target openproof_gateway_http_tests --parallel 2
          ./cmake-build-gcc-release/tests/openproof_gateway_http_tests \
            --gtest_filter='BeastHttpIntegrationTest.*'

      - name: Build opp executable
        run: cmake --build --preset gcc-release --target opp --parallel 2

      # Run the real application E2E immediately after the executable
      # links, even if another independent test binary cannot link. A
      # benchmark result is still NOT release approval without all gates.
      - name: Isolated OpenProof PostgreSQL E2E and mixed-read benchmark
        timeout-minutes: 20
        env:
          OPENPROOF_E2E_POSTGRES: postgresql://openproof_ci:ci_disposable_only@127.0.0.1:5432/openproof_e2e
          OPENPROOF_E2E_DATABASE_ACK: YES_I_UNDERSTAND_THIS_DATABASE_MUST_BE_DISPOSABLE
          OPENPROOF_E2E_LOAD_REQUESTS: "600"
          OPENPROOF_E2E_LOAD_CONCURRENCY: "24"
          OPENPROOF_E2E_METRICS_FILE: ${{ github.workspace }}/openproof-e2e-metrics.json
        run: |
          sudo -u postgres createdb -O openproof_ci openproof_e2e
          node scripts/e2e-identity-platform.mjs

      - name: Preserve non-sensitive E2E benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openproof-e2e-metrics
          path: openproof-e2e-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: cmake --build --preset gcc-release --parallel 2

      - name: Test
        run: ctest --preset gcc-release --output-on-failure

      # Paired comparison is deliberately gated on the *full* test suite.
      # The candidate and pinned mainline baseline run on the same runner,
      # with distinct disposable databases and the same E2E workload.
      - name: Paired baseline E2E benchmark
        timeout-minutes: 35
        run: bash scripts/ci/run-paired-e2e-baseline.sh

      - name: Preserve pinned baseline benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openproof-e2e-baseline-metrics
          path: openproof-e2e-metrics-baseline.json
          if-no-files-found: ignore
          retention-days: 14

      # Real opp server binaries with a controlled 50ms local HTTP upstream.
      # Unlike the identity E2E sample, this exposes whether upstream network
      # waiting has stopped monopolizing the bounded handler workers.
      - name: Matched Gateway TCP delayed-upstream benchmark
        timeout-minutes: 10
        env:
          OPENPROOF_GATEWAY_BENCH_REQUESTS: "600"
          OPENPROOF_GATEWAY_BENCH_CONCURRENCY: "24"
          OPENPROOF_GATEWAY_BENCH_DELAY_MS: "50"
          OPENPROOF_GATEWAY_BENCH_METRICS: "1"
        run: |
          mkdir -p gateway-bench
          # Alternate execution order on the SAME runner to limit bias from
          # warm-up, CPU frequency and shared-runner scheduling.
          for trial in 1 2 3 4 5; do
            if (( trial % 2 == 0 )); then
              OPENPROOF_GATEWAY_BENCH_COMMIT=ccb396182936d717960fdca319999baf2f580ff9 \
                node scripts/benchmark-gateway-upstream.mjs \
                "${RUNNER_TEMP}/openproof-perf-baseline/cmake-build-gcc-release/apps/opp/opp" \
                "gateway-bench/baseline-${trial}.json"
              node scripts/benchmark-gateway-upstream.mjs \
                ./cmake-build-gcc-release/apps/opp/opp \
                "gateway-bench/candidate-${trial}.json"
            else
              node scripts/benchmark-gateway-upstream.mjs \
                ./cmake-build-gcc-release/apps/opp/opp \
                "gateway-bench/candidate-${trial}.json"
              OPENPROOF_GATEWAY_BENCH_COMMIT=ccb396182936d717960fdca319999baf2f580ff9 \
                node scripts/benchmark-gateway-upstream.mjs \
                "${RUNNER_TEMP}/openproof-perf-baseline/cmake-build-gcc-release/apps/opp/opp" \
                "gateway-bench/baseline-${trial}.json"
            fi
          done
          node scripts/summarize-gateway-bench.mjs gateway-bench

      - name: Preserve actual Gateway TCP measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openproof-gateway-tcp-benchmark
          path: gateway-bench/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build release packages
        run: |
          mkdir -p dist
          ./packaging/build-deb.sh cmake-build-gcc-release dist amd64
          ./packaging/build-bundle.sh cmake-build-gcc-release dist amd64
          dpkg-deb --info dist/openproof_*_amd64.deb
          tar -tzf dist/openproof_*_linux_amd64.tar.gz | grep -q './opt/openproof/bin/opp.real'
